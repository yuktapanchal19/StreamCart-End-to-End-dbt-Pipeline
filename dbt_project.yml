name: 'streamcart_dbt'
version: '1.0.0'

config-version: 2

profile: 'streamcart_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  streamcart_dbt:

    staging:
      +materialized: view

    intermediate:
      +materialized: ephemeral

    marts:
      +materialized: table

seeds:
  streamcart_dbt:
    channel_mapping:
      +column_types:
        channel_code: varchar(20)
        channel_label: varchar(20)
        channel_group: varchar(20)
        is_digital: boolean

    country_config:
      +column_types:
        country_code: varchar(20)
        country_name: varchar(20)  
        region: varchar(20)
        currency_default: varchar(20)
        tax_rate_pct: float

on-run-start:
  - >
    CREATE TABLE IF NOT EXISTS {{ target.schema }}.dbt_run_log
    (
      run_id VARCHAR,
      started_at TIMESTAMP,
      target_name VARCHAR
    )

  - >
    INSERT INTO {{ target.schema }}.dbt_run_log
    VALUES
    (
      '{{ invocation_id }}',
      '{{ run_started_at }}',
      '{{ target.name }}'
    )

on-run-end:
  - >
    GRANT SELECT
    ON ALL TABLES IN SCHEMA {{ target.schema }}
    TO ROLE reporting_role