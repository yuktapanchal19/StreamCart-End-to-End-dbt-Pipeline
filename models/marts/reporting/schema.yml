version: 2

models:

  - name: monthly_revenue_summary

    description: >
      Monthly revenue KPI summary containing order counts,
      gross revenue, net revenue, discounts, top category,
      and top channel.

    meta:
      owner: 'data-eng@streamcart.com'
      contains_pii: true
      refresh_frequency: 'daily'

    columns:

      - name: order_year
        description: "Calendar year of the order."

      - name: order_month
        description: "Calendar month of the order."

      - name: total_orders
        description: "Number of distinct successful orders."

      - name: total_gross_revenue
        description: "Gross revenue from successful orders."

      - name: total_net_revenue
        description: "Net revenue from successful orders."

      - name: total_discount_given
        description: "Total discount amount given."

      - name: avg_discount_pct
        description: "Average discount percentage."

      - name: top_category
        description: "Category with the highest monthly net revenue."

      - name: top_channel
        description: "Channel with the highest monthly order count."


  - name: product_performance

    description: >
      Product-level performance KPI model containing sales,
      revenue, discounts, margins, inventory, and revenue ranking.

    meta:
      owner: 'data-eng@streamcart.com'
      contains_pii: true
      refresh_frequency: 'daily'

    columns:

      - name: product_id
        description: "Unique product identifier."

      - name: product_name
        description: "Product name."

      - name: category
        description: "Product category."

      - name: sub_category
        description: "Product sub-category."

      - name: brand
        description: "Product brand."

      - name: margin_pct
        description: "Product margin percentage."

      - name: is_low_stock
        description: "Whether inventory is at or below reorder level."

      - name: total_units_sold
        description: "Total units sold through successful orders."

      - name: total_net_revenue
        description: "Total net revenue from successful orders."

      - name: avg_discount_pct
        description: "Average discount percentage."

      - name: revenue_rank
        description: "Revenue ranking within the product category."

      - name: qty_on_hand
        description: "Current quantity available."

      - name: reorder_level
        description: "Inventory reorder threshold."

      - name: warehouse_code
        description: "Warehouse identifier."


  - name: channel_performance_summary

    description: >
      Daily channel performance KPI model containing order volume,
      success rates, revenue, average order value, and payment method usage.

    meta:
      owner: 'data-eng@streamcart.com'
      contains_pii: true
      refresh_frequency: 'daily'

    columns:

      - name: order_date
        description: "Date of the order."

      - name: channel
        description: "Sales channel."

      - name: total_orders
        description: "Total number of orders."

      - name: successful_orders
        description: "Number of successful orders."

      - name: cancelled_orders
        description: "Number of cancelled orders."

      - name: success_rate_pct
        description: "Percentage of orders that were successful."

      - name: total_gross_revenue
        description: "Total gross revenue."

      - name: total_net_revenue
        description: "Total net revenue."

      - name: avg_order_value
        description: "Average order value."

      - name: most_used_payment_method
        description: "Most frequently used payment method."